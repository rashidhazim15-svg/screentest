name: Build Maramm Live IPA (free)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios-live/project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ios-live/MarammLive.xcodeproj \
            -scheme MarammLive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            BUILD_DIR="$PWD/build-live" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build-live/Release-iphoneos/MarammLive.app Payload/
          zip -qry MarammLive.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MarammLive-ipa
          path: MarammLive.ipa
          if-no-files-found: error
